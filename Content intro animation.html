<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 75vh;
  background: #111;
  color: #00ffc; /* do you believe in ghosts color */
  font-family: monospace;
  font-size: 2rem;
}

.typing {
  overflow: hidden;
  white-space: nowrap;
  border-right: 3px solid #00ffcc;
  animation: typing 4s steps(20, end), blink 0.7s step-end infinite;
}

@keyframes typing {
  from { width: 0; }
  to { width: 18ch; }
}

@keyframes blink {
  50% { border-color: transparent; }
}
</style>
</head>
<body>
  <div class="typing">Ahh sheit here we go again...</div>
</body>
